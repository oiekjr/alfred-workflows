[tools]
node = "24.19.0"

[tasks.source-check]
description = "Node.jsソースとAlfred定義を検査する"
run = "node scripts/check-syntax.mjs"

[tasks.test]
description = "Node.jsの単体テストを実行する"
run = "node --test test/*.test.mjs"

[tasks.check]
description = "すべての検査を実行する"
depends = ["source-check", "test"]

[tasks.build]
description = "Node.jsソース配布ツリーを構築する"
run = "./scripts/build.sh"

[tasks.package]
description = "Alfredワークフローをパッケージ化する"
depends = ["build"]
run = "./scripts/package.sh"
